services:
  frontend_server:
    image: frontend
    build: ./frontend
    container_name: frontend
    security_opt:
      - label:disable # This relaxes AppArmor/SELinux for this container
    init: true
    ports:
     - "5173:5173"
    # In host mode, ports: are ignored because it uses your PC's real ports
    depends_on:
      - backend_server
    command: >
      sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: "http://localhost:8081"

  backend_server:
    build: ./backend
    ports:
     - "8081:8081"
    security_opt:
      - label:disable # This relaxes AppArmor/SELinux for this container
    init: true
    environment:
      - JWT_SECRET=${JWT_SECRET}
      # We use 'db' because Docker DNS maps 'db' to the database container's IP
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      npx prisma db push  --schema=./src/prisma/schema.prisma && node dist/index.js"

  db:
    privileged: true
    image: postgres:13.2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  database: