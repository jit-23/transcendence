services:
  frontend_server:
    image: frontend
    build: ./frontend
    container_name: frontend
    security_opt:
      - label:disable
    init: true
    ports:
      - "5173:5173"
    depends_on:
      - backend_server
    command: >
      sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./certs:/etc/ssl/certs:ro
    environment:
      VITE_API_URL: "https://${HOST:-localhost}:8081"
      VITE_HTTPS: "true"
      VITE_HTTPS_CERT: "/etc/ssl/certs/server.cert"
      VITE_HTTPS_KEY: "/etc/ssl/certs/server.key"
    networks:
      - observability

  backend_server:
    image: backend
    build: ./backend
    container_name: backend
    ports:
      - "8081:8081"
    security_opt:
      - label:disable
    init: true
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HOST=${HOST:-localhost}
      - CORS_ORIGIN=https://${HOST:-localhost}:5173
      - FRONTEND_URL=https://${HOST:-localhost}:5173
      - SSL_CERT_PATH=/etc/ssl/certs/server.cert
      - SSL_KEY_PATH=/etc/ssl/certs/server.key
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://${HOST:-localhost}:8081/users/auth/google/callback
      - FORTYTWO_CLIENT_ID=${FORTYTWO_CLIENT_ID}
      - FORTYTWO_CLIENT_SECRET=${FORTYTWO_CLIENT_SECRET}
      - FORTYTWO_REDIRECT_URI=https://${HOST:-localhost}:8081/users/auth/42/callback
    volumes:
      - ./certs:/etc/ssl/certs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - observability
  db:
    privileged: true
    image: postgres:13.2
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-web.yml:/etc/prometheus/web.yml:ro
      - ./certs:/etc/prometheus/ssl:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend_server
    networks:
      - observability
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--log.level=error'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: root
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./certs:/etc/grafana/ssl:ro
    depends_on:
      - prometheus
    networks:
      - observability
    environment:
      - GF_LOG_LEVEL=error
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/ssl/server.cert
      - GF_SERVER_CERT_KEY=/etc/grafana/ssl/server.key
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false

volumes:
  database:
  prometheus_data:
  grafana_data:

networks:
  observability:
    driver: bridge